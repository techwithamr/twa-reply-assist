<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TWA Reply Assist — تحميل</title>
    <link rel="stylesheet" href="./download.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <h1 class="brand">Tech With <span>Amr</span></h1>
        <p class="lead">حمّل الإضافة أو حزمة الإعداد لويندوز من هنا.</p>
        <div class="cta-row">
          <button type="button" class="btn btn-primary" id="setupBtn">نزّل حزمة الإعداد لويندوز</button>
        </div>
        <p class="links">
          <a id="chromeBtn" href="#">إضافة كروم (ZIP)</a>
          <span aria-hidden="true">·</span>
          <a id="androidBtn" href="#">أندرويد</a>
        </p>
        <p class="meta" id="releaseMeta">—</p>
        <p class="status" id="status">جاري تجهيز الحزم…</p>
      </section>
      <p class="foot">
        الموديل <code>gpt-4.1-mini</code> · النشر يدوي دائمًا · المفتاح ما بيتكتبش في الملفات.
      </p>
    </main>
    <script>
      const status = document.getElementById("status");
      const chromeBtn = document.getElementById("chromeBtn");
      const androidBtn = document.getElementById("androidBtn");
      const releaseMeta = document.getElementById("releaseMeta");
      const setupBtn = document.getElementById("setupBtn");
      const isLocal = location.hostname === "127.0.0.1" || location.hostname === "localhost";

      function setStatus(text) {
        status.textContent = text;
      }

      function releaseUrl(name) {
        return "./release/" + name;
      }

      function downloadFile(name) {
        const a = document.createElement("a");
        a.href = releaseUrl(name);
        a.download = name;
        a.click();
      }

      async function loadCatalog() {
        const paths = isLocal
          ? ["/api/catalog", "./release/catalog.json"]
          : ["./release/catalog.json"];
        let data = null;
        for (const path of paths) {
          try {
            const res = await fetch(path, { cache: "no-store" });
            if (res.ok) {
              data = await res.json();
              break;
            }
          } catch {
            // try next
          }
        }
        if (!data) throw new Error("catalog failed");

        chromeBtn.href = releaseUrl(data.chrome.file);
        chromeBtn.download = data.chrome.file;
        chromeBtn.textContent = "إضافة كروم (ZIP)";

        if (data.android.apk) {
          androidBtn.href = releaseUrl(data.android.apk);
          androidBtn.download = data.android.apk;
          androidBtn.textContent = "أندرويد (APK)";
          releaseMeta.textContent =
            "الإصدار " + data.version + " · كروم + APK جاهز";
        } else {
          androidBtn.href = releaseUrl(data.android.zip);
          androidBtn.download = data.android.zip;
          androidBtn.textContent = "أندرويد (مشروع Studio)";
          releaseMeta.textContent =
            "الإصدار " + data.version + " · كروم جاهز · APK بعد البناء في Android Studio";
        }

        setupBtn.textContent = isLocal
          ? "ثبّت على هذا الجهاز"
          : "نزّل حزمة الإعداد لويندوز";
        setStatus("جاهز · الإصدار " + data.version);
        return data;
      }

      let catalog = null;

      setupBtn.addEventListener("click", async () => {
        setupBtn.disabled = true;
        try {
          if (isLocal) {
            setStatus("بيثبّت محليًا…");
            const res = await fetch("/api/setup", { method: "POST" });
            if (res.ok) {
              const body = await res.json();
              if (body.ok) {
                setStatus(
                  "تم محليًا. المجلد: C:\\Github\\twa-reply-assist\nالصق مفتاح OpenAI من أيقونة الإضافة."
                );
                return;
              }
            }
            setStatus("الإعداد المحلي فشل. نزّل الحزمة وشغّل twa-setup.cmd");
          }

          const bundle = catalog?.setup?.bundle;
          if (bundle) {
            downloadFile(bundle);
            setStatus("اتحمّل حزمة الإعداد. فك الضغط وشغّل twa-setup.cmd");
          } else if (catalog?.setup?.windows) {
            downloadFile(catalog.setup.windows);
            setStatus("اتحمّل ملف الإعداد. حطّه جنب ZIP الكروم وشغّله.");
          } else {
            setStatus("ما لقيتش حزمة الإعداد.");
          }
        } catch {
          setStatus("حصل خطأ. جرّب رابط كروم أو أندرويد تحت.");
        } finally {
          setupBtn.disabled = false;
        }
      });

      loadCatalog()
        .then((data) => {
          catalog = data;
        })
        .catch(() =>
          setStatus(
            isLocal
              ? "ما لقيتش الحزم. شغّل: npm run download"
              : "ما لقيتش الحزم على السيرفر."
          )
        );
    </script>
  </body>
</html>
