<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fake LinkedIn — TWA proof</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f3f2ef; margin: 0; padding: 24px; }
      article { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 16px; }
      .update-components-text { font-size: 16px; line-height: 1.4; }
      .comments-comment-box { margin-top: 16px; border-top: 1px solid #eee; padding-top: 12px; }
      .ql-editor { min-height: 40px; border: 1px solid #ccc; border-radius: 20px; padding: 8px 12px; }
    </style>
  </head>
  <body>
    <article>
      <strong>Hotel & Configuration post</strong>
      <p class="update-components-text">
        Where is the segmentation between VLAN 10 and VLAN 20? Network design needs a clear boundary.
      </p>
      <div class="comments-comment-box">
        <div class="ql-editor" contenteditable="true">Add a comment…</div>
      </div>
    </article>
    <script>
      window.chrome = {
        runtime: {
          sendMessage(_msg, cb) {
            setTimeout(function () {
              cb({
                ok: true,
                drafts: [
                  "The VLAN 10/20 split belongs at the routed boundary — an SVI or firewall, not a switch ACL. Happy to sketch that segmentation if useful.",
                ],
              });
            }, 250);
          },
        },
      };
    </script>
    <script src="/content/alive.js"></script>
  </body>
</html>
